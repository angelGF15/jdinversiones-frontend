<div
  class="global-skeleton-container"
  role="status"
  aria-live="polite"
  aria-busy="true"
>
  <span class="sr-only">Cargando contenido de la aplicación...</span>

  <!-- ================= VARIANT: LOGIN ================= -->
  @if (variant === 'login') {
    <div class="min-h-screen bg-tech-pattern flex flex-col justify-center items-center px-4 py-8 relative overflow-hidden">
      <!-- Ambient Glow Blobs -->
      <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>

      <div class="w-full max-w-md bg-slate-900/80 border border-slate-700/50 backdrop-blur-xl rounded-2xl p-6 sm:p-8 shadow-2xl relative z-10 animate-fade-in">
        <!-- Brand & Header Skeleton -->
        <div class="flex flex-col items-center text-center mb-8">
          <div class="w-14 h-14 rounded-2xl skeleton-shimmer mb-4 border border-slate-700/50"></div>
          <div class="h-6 w-48 rounded-lg skeleton-shimmer mb-2"></div>
          <div class="h-4 w-64 rounded-md skeleton-shimmer"></div>
        </div>

        <!-- Form Fields Skeleton -->
        <div class="space-y-5">
          <!-- Email input skeleton -->
          <div>
            <div class="h-4 w-28 rounded skeleton-shimmer mb-2"></div>
            <div class="h-12 w-full rounded-xl skeleton-shimmer border border-slate-800"></div>
          </div>

          <!-- Password input skeleton -->
          <div>
            <div class="flex justify-between items-center mb-2">
              <div class="h-4 w-24 rounded skeleton-shimmer"></div>
            </div>
            <div class="h-12 w-full rounded-xl skeleton-shimmer border border-slate-800"></div>
          </div>

          <!-- Submit Button skeleton -->
          <div class="pt-2">
            <div class="h-12 w-full rounded-xl skeleton-shimmer bg-primary/30 border border-primary/40"></div>
          </div>
        </div>

        <!-- Security Pill Badge skeleton -->
        <div class="mt-8 flex justify-center">
          <div class="h-6 w-52 rounded-full skeleton-shimmer border border-slate-800"></div>
        </div>
      </div>

      <!-- Footer system info skeleton -->
      <div class="mt-6 h-3 w-40 rounded skeleton-shimmer opacity-40"></div>
    </div>
  }

  <!-- ================= VARIANT: ADMIN ================= -->
  @else if (variant === 'admin') {
    <div class="min-h-screen bg-slate-950 flex flex-col md:flex-row animate-fade-in">
      <!-- Sidebar Skeleton (desktop) -->
      <aside class="hidden md:flex flex-col w-64 bg-slate-900 border-r border-slate-800 p-4 space-y-6">
        <div class="flex items-center gap-3 px-2 py-3">
          <div class="w-10 h-10 rounded-xl skeleton-shimmer"></div>
          <div class="h-5 w-32 rounded skeleton-shimmer"></div>
        </div>

        <div class="space-y-3 pt-4">
          @for (i of [1, 2, 3, 4, 5, 6]; track i) {
            <div class="h-10 w-full rounded-lg skeleton-shimmer"></div>
          }
        </div>
      </aside>

      <!-- Main Shell Skeleton -->
      <div class="flex-1 flex flex-col">
        <!-- Header Skeleton -->
        <header class="h-16 bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between">
          <div class="h-8 w-60 rounded-lg skeleton-shimmer"></div>
          <div class="flex items-center gap-4">
            <div class="w-9 h-9 rounded-full skeleton-shimmer"></div>
            <div class="w-10 h-10 rounded-full skeleton-shimmer"></div>
          </div>
        </header>

        <!-- Content Area Skeleton -->
        <main class="p-6 space-y-6 flex-1">
          <!-- Page Title & Actions -->
          <div class="flex justify-between items-center">
            <div class="space-y-2">
              <div class="h-7 w-48 rounded skeleton-shimmer"></div>
              <div class="h-4 w-72 rounded skeleton-shimmer"></div>
            </div>
            <div class="h-10 w-32 rounded-lg skeleton-shimmer"></div>
          </div>

          <!-- KPI Cards Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            @for (card of [1, 2, 3, 4]; track card) {
              <div class="p-5 rounded-xl bg-slate-900 border border-slate-800 space-y-3">
                <div class="flex justify-between items-center">
                  <div class="h-4 w-24 rounded skeleton-shimmer"></div>
                  <div class="w-8 h-8 rounded-lg skeleton-shimmer"></div>
                </div>
                <div class="h-8 w-32 rounded skeleton-shimmer"></div>
                <div class="h-3 w-20 rounded skeleton-shimmer"></div>
              </div>
            }
          </div>

          <!-- Main Table / Chart Placeholder -->
          <div class="p-6 rounded-xl bg-slate-900 border border-slate-800 space-y-4">
            <div class="h-6 w-40 rounded skeleton-shimmer"></div>
            <div class="space-y-3 pt-2">
              @for (row of [1, 2, 3, 4, 5]; track row) {
                <div class="h-12 w-full rounded-lg skeleton-shimmer"></div>
              }
            </div>
          </div>
        </main>
      </div>
    </div>
  }

  <!-- ================= VARIANT: FULL / GENERAL ================= -->
  @else {
    <div class="min-h-screen bg-slate-950 p-6 space-y-6 animate-fade-in">
      <!-- Universal Navbar Skeleton -->
      <div class="h-16 w-full rounded-xl bg-slate-900 border border-slate-800 px-6 flex items-center justify-between">
        <div class="h-7 w-40 rounded-lg skeleton-shimmer"></div>
        <div class="flex gap-4">
          <div class="h-8 w-20 rounded-lg skeleton-shimmer"></div>
          <div class="h-8 w-24 rounded-lg skeleton-shimmer"></div>
        </div>
      </div>

      <!-- Hero / Section Skeleton -->
      <div class="h-64 w-full rounded-2xl bg-slate-900 border border-slate-800 p-8 flex flex-col justify-center space-y-4">
        <div class="h-8 w-72 rounded-lg skeleton-shimmer"></div>
        <div class="h-4 w-96 rounded skeleton-shimmer"></div>
        <div class="h-10 w-36 rounded-xl skeleton-shimmer mt-2"></div>
      </div>

      <!-- Cards Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        @for (item of [1, 2, 3]; track item) {
          <div class="p-6 rounded-xl bg-slate-900 border border-slate-800 space-y-4">
            <div class="h-40 w-full rounded-lg skeleton-shimmer"></div>
            <div class="h-5 w-3/4 rounded skeleton-shimmer"></div>
            <div class="h-4 w-1/2 rounded skeleton-shimmer"></div>
          </div>
        }
      </div>
    </div>
  }
</div>
