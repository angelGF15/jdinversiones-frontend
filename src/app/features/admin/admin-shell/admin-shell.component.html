<div class="min-h-screen bg-slate-950 flex flex-col md:flex-row overflow-hidden">
  <!-- Global Sidebar -->
  <app-sidebar
    [isOpen]="isMobileOpen()"
    [isCollapsed]="isSidebarCollapsed()"
    (closeMobile)="closeMobileMenu()"
    (logoutTriggered)="handleLogout()"
  />

  <!-- Main Work Area Container -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
    <!-- Global Header -->
    <app-header
      [isSidebarCollapsed]="isSidebarCollapsed()"
      (toggleMobileMenu)="toggleMobileMenu()"
      (toggleSidebarCollapse)="toggleSidebarCollapse()"
      (logoutTriggered)="handleLogout()"
    />

    <!-- Routed Main Content with Dedicated Independent Scroll -->
    <main class="flex-1 overflow-y-auto bg-slate-950 p-4 sm:p-6 lg:p-8 custom-scrollbar">
      <div class="max-w-7xl mx-auto">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
