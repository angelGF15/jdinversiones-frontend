<div class="admin-shell-layout">
  <!-- Global Header (Full Width on Top) -->
  <app-header
    [isSidebarCollapsed]="isSidebarCollapsed()"
    (toggleMobileMenu)="toggleMobileMenu()"
    (toggleSidebarCollapse)="toggleSidebarCollapse()"
    (logoutTriggered)="handleLogout()"
  />

  <!-- Body: Sidebar Under the Header + Main Content Area -->
  <div class="admin-shell-body">
    <!-- Global Sidebar (Under the Header) -->
    <app-sidebar
      [isOpen]="isMobileOpen()"
      [isCollapsed]="isSidebarCollapsed()"
      (closeMobile)="closeMobileMenu()"
      (logoutTriggered)="handleLogout()"
      (expandSidebar)="isSidebarCollapsed.set(false)"
    />

    <!-- Routed Main Content with Dedicated Independent Scroll -->
    <main class="admin-shell-main-scroll">
      <div class="admin-shell-content-wrapper">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
