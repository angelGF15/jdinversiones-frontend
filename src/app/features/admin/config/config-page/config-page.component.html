<div class="config-page flex flex-col gap-6 w-full">
  <!-- Cabecera Principal de Configuración -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div class="flex items-center gap-3.5">
      <div
        aria-hidden="true"
        class="w-11 h-11 rounded-2xl bg-primary-50 dark:bg-primary-950/40 text-primary dark:text-primary-300 flex items-center justify-center border border-primary-100 dark:border-primary-800/40 shadow-sm flex-shrink-0"
      >
        <span class="mat-icon text-2xl select-none">settings</span>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">
          Configuración del Sistema
        </h1>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
          Administra los datos de la empresa, los umbrales operativos y los contactos que reciben notificaciones.
        </p>
      </div>
    </div>
  </div>

  <!-- Barra de Pestañas Propias (sin MatTabsModule) -->
  <div class="w-full border-b border-slate-200/80 dark:border-slate-800/80 pb-4">
    <div
      role="tablist"
      aria-label="Pestañas de configuración"
      class="inline-flex p-1.5 gap-1.5 rounded-2xl bg-slate-100 dark:bg-slate-800/60 max-w-full overflow-x-auto"
    >
      @for (tab of tabs; track tab.key) {
        <button
          type="button"
          role="tab"
          [id]="'config-tab-' + tab.key"
          [attr.aria-selected]="activeTab() === tab.key"
          [attr.aria-controls]="'config-panel-' + tab.key"
          (click)="selectTab(tab.key)"
          class="config-tab inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-primary select-none whitespace-nowrap"
          [ngClass]="
            activeTab() === tab.key
              ? 'bg-white dark:bg-slate-900 text-primary dark:text-primary-400 font-semibold shadow-sm'
              : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 font-medium'
          "
        >
          <span class="mat-icon text-lg select-none">{{ tab.icon }}</span>
          <span>{{ tab.label }}</span>
        </button>
      }
    </div>
  </div>

  <!-- Contenido de las Pestañas -->
  <main class="w-full">
    @if (activeTab() === 'general') {
      <app-config-general
        id="config-panel-general"
        role="tabpanel"
        aria-labelledby="config-tab-general"
        [canEdit]="canEdit()"
      />
    } @else {
      <app-config-recipients
        id="config-panel-recipients"
        role="tabpanel"
        aria-labelledby="config-tab-recipients"
        [canEdit]="canEdit()"
      />
    }
  </main>
</div>
