<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient matching brand emblem -->
    <radialGradient id="emblemBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4aa7ee" />
      <stop offset="45%" stop-color="#1b77cb" />
      <stop offset="85%" stop-color="#0b54a2" />
      <stop offset="100%" stop-color="#043b78" />
    </radialGradient>

    <!-- Phone Drop Shadow -->
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#010f48" flood-opacity="0.45" />
    </filter>

    <!-- Paths for Curved Text -->
    <!-- Top Arc for "TIENDA Y CENTRO TECNICO" -->
    <path id="topTextArc" d="M 68,250 A 182,182 0 0,1 432,250" fill="none" />
    
    <!-- Bottom Arc for "INVERSIONES" (reversed so text reads upright) -->
    <path id="bottomTextArc" d="M 432,250 A 182,182 0 0,1 68,250" fill="none" />
  </defs>

  <!-- Outer Ring (Dark Edge) -->
  <circle cx="250" cy="250" r="242" fill="#000000" />
  
  <!-- Main Blue Radial Circle -->
  <circle cx="250" cy="250" r="234" fill="url(#emblemBgGrad)" stroke="#1a5ea6" stroke-width="2" />

  <!-- Inner Subtle Tech Ring -->
  <circle cx="250" cy="250" r="198" fill="none" stroke="#68b4f4" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.35" />

  <!-- ============================================== -->
  <!-- CENTER GRAPHIC: TRAILS + GEAR + SMARTPHONE     -->
  <!-- ============================================== -->

  <!-- Cobalt Blue Technical Gear (Right side) -->
  <g fill="#0256a9" stroke="#014285" stroke-width="1.5">
    <!-- Gear outer teeth -->
    <!-- Center of gear around (320, 250) -->
    <path d="
      M 320, 160 l 12,0 l 4,14 l 14,3 l 10,-10 l 9,9 l -10,10 l 3,14 l 14,4 l 0,12 l -14,4 l -3,14 l 10,10 l -9,9 l -10,-10 l -14,3 l -4,14 l -12,0 l -4,-14 l -14,-3 l -10,10 l -9,-9 l 10,-10 l -3,-14 l -14,-4 l 0,-12 l 14,-4 l 3,-14 l -10,-10 l 9,-9 l 10,10 l 14,-3 z
    " transform="translate(45, 0) scale(1.15)" />
    <!-- Gear Center Hole -->
    <circle cx="413" cy="250" r="32" fill="#146ebd" />
  </g>

  <!-- Cobalt Blue Speed Trails (Left side) -->
  <g fill="#0256a9">
    <!-- Trail 1 -->
    <rect x="140" y="125" width="190" height="36" rx="18" />
    <!-- Trail 2 -->
    <rect x="115" y="196" width="220" height="38" rx="19" />
    <!-- Trail 3 -->
    <rect x="85" y="232" width="115" height="34" rx="17" />
    <!-- Trail 4 -->
    <rect x="100" y="268" width="100" height="34" rx="17" />
    <!-- Trail 5 -->
    <rect x="135" y="338" width="80" height="36" rx="18" />
    <!-- Small floating dot -->
    <circle cx="106" cy="356" r="14" />
  </g>

  <!-- Central Smartphone Device -->
  <g filter="url(#phoneShadow)">
    <!-- Phone Body (White) -->
    <rect x="210" y="150" width="106" height="212" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2.5" />
    
    <!-- Camera/Speaker Notch -->
    <rect x="236" y="155" width="54" height="6" rx="3" fill="#0f172a" />

    <!-- JD Monogram Logo at top of phone screen -->
    <g transform="translate(230, 168)">
      <!-- J with top serif bar -->
      <path d="M 1,4 L 28,4 L 28,10 L 18,10 L 18,34 C 18,43 14,48 5,48 C 2,48 0,47.5 -2,47 L -2,41 C -0.5,41.5 1,41.7 3,41.7 C 7,41.7 9.5,39 9.5,33 L 9.5,10 L 1,10 Z" fill="#0256a9" />
      <!-- D bold -->
      <path d="M 33,4 L 50,4 C 63,4 71,12 71,26 C 71,40 63,48 50,48 L 33,48 Z M 42,12 L 42,40 L 49,40 C 57,40 62,35 62,26 C 62,17 57,12 49,12 Z" fill="#0256a9" />
    </g>

    <!-- Dial Pad Keypad (Grid of 12 buttons) -->
    <!-- Row 1 -->
    <circle cx="233" cy="250" r="9" fill="#f1f5f9" />
    <text x="233" y="253.5" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#1e293b" text-anchor="middle">1</text>
    
    <circle cx="263" cy="250" r="9" fill="#f1f5f9" />
    <text x="263" y="253.5" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#1e293b" text-anchor="middle">2</text>
    <text x="263" y="257.5" font-family="'Inter', sans-serif" font-size="4" fill="#64748b" text-anchor="middle">ABC</text>

    <circle cx="293" cy="250" r="9" fill="#f1f5f9" />
    <text x="293" y="253.5" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#1e293b" text-anchor="middle">3</text>
    <text x="293" y="257.5" font-family="'Inter', sans-serif" font-size="4" fill="#64748b" text-anchor="middle">DEF</text>

    <!-- Row 2 -->
    <circle cx="233" cy="272" r="9" fill="#f1f5f9" />
    <text x="233" y="275.5" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#1e293b" text-anchor="middle">4</text>
    
    <circle cx="263" cy="272" r="9" fill="#f1f5f9" />
    <text x="263" y="275.5" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#1e293b" text-anchor="middle">5</text>

    <circle cx="293" cy="272" r="9" fill="#f1f5f9" />
    <text x="293" y="275.5" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#1e293b" text-anchor="middle">6</text>

    <!-- Row 3 -->
    <circle cx="233" cy="294" r="9" fill="#f1f5f9" />
    <text x="233" y="297.5" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#1e293b" text-anchor="middle">7</text>
    
    <circle cx="263" cy="294" r="9" fill="#f1f5f9" />
    <text x="263" y="297.5" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#1e293b" text-anchor="middle">8</text>

    <circle cx="293" cy="294" r="9" fill="#f1f5f9" />
    <text x="293" y="297.5" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#1e293b" text-anchor="middle">9</text>

    <!-- Row 4 -->
    <circle cx="233" cy="316" r="9" fill="#f1f5f9" />
    <text x="233" y="320" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#1e293b" text-anchor="middle">*</text>
    
    <circle cx="263" cy="316" r="9" fill="#f1f5f9" />
    <text x="263" y="319.5" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#1e293b" text-anchor="middle">0</text>

    <circle cx="293" cy="316" r="9" fill="#f1f5f9" />
    <text x="293" y="319.5" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#1e293b" text-anchor="middle">#</text>

    <!-- Green Call Action Button -->
    <circle cx="263" cy="342" r="11" fill="#22c55e" />
    <!-- Telephone receiver icon in white -->
    <path d="M 258.5,339 C 258.5,338 259.5,337.5 260.5,338.5 L 262,340 C 262.5,340.5 262.5,341 262,341.5 L 261.3,342.2 C 261.8,343.3 262.7,344.2 263.8,344.7 L 264.5,344 C 265,343.5 265.5,343.5 266,344 L 267.5,345.5 C 268.5,346.5 268,347.5 267,347.5 C 263.5,347.5 258.5,342.5 258.5,339 Z" fill="#ffffff" />
  </g>

  <!-- ============================================== -->
  <!-- CURVED TYPOGRAPHY                              -->
  <!-- ============================================== -->

  <!-- Top Curved Text: TIENDA Y CENTRO TECNICO -->
  <text fill="#ffffff" font-family="'Inter', 'Arial Black', 'Helvetica', sans-serif" font-size="28" font-weight="900" letter-spacing="4.5">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">TIENDA Y CENTRO TECNICO</textPath>
  </text>

  <!-- Bottom Curved Text: INVERSIONES -->
  <text fill="#ffffff" font-family="'Inter', 'Arial Black', 'Helvetica', sans-serif" font-size="38" font-weight="900" letter-spacing="10">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">INVERSIONES</textPath>
  </text>
</svg>
